<title>Hallsta MFA Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a step list on the left (top strip on phones) and one review step at a time; every reviewable block carries OK / Question / Wrong and the group's marks. */
:root{
  --bg:#f6f7f5; --panel:#ffffff; --ink:#15211c; --ink-2:#4a5650; --ink-3:#7c8782; --line:#dfe3df; --line-2:#eceeeb;
  --accent:#1f5c4a; --accent-soft:#e2eee9;
  --elec:#2a78d6; --steam:#eb6834; --water:#1baf7a; --resid:#9aa29e; --useful:#008300;
  --ok:#0c7a3e; --ok-soft:#e1f2e8; --q:#a86400; --q-soft:#fbefd8; --bad:#c43737; --bad-soft:#f9e1e0; --add:#2a5db0; --add-soft:#e3ecfa;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121715; --panel:#1a201d; --ink:#e8ede9; --ink-2:#b4bdb8; --ink-3:#86908b; --line:#2c3531; --line-2:#232a27;
  --accent:#6fc2a5; --accent-soft:#1f3a31; --elec:#3987e5; --steam:#d95926; --water:#199e70; --resid:#6f7873; --useful:#3fa83f;
  --ok:#5fca8a; --ok-soft:#173526; --q:#e5a640; --q-soft:#3a2c12; --bad:#ef7777; --bad-soft:#3d1c1c; --add:#7aa7ef; --add-soft:#1b2a44; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121715; --panel:#1a201d; --ink:#e8ede9; --ink-2:#b4bdb8; --ink-3:#86908b; --line:#2c3531; --line-2:#232a27;
  --accent:#6fc2a5; --accent-soft:#1f3a31; --elec:#3987e5; --steam:#d95926; --water:#199e70; --resid:#6f7873; --useful:#3fa83f;
  --ok:#5fca8a; --ok-soft:#173526; --q:#e5a640; --q-soft:#3a2c12; --bad:#ef7777; --bad-soft:#3d1c1c; --add:#7aa7ef; --add-soft:#1b2a44; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:26px 80px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:650}
h3{font-size:1.02rem;font-weight:650;margin-top:6px}
p{margin:0;max-width:78ch}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
header.top{display:grid;gap:8px;margin-bottom:18px}
.statusbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:.85rem;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:.8rem}
.pill .dot{width:8px;height:8px;border-radius:50%}
.banner{padding:10px 14px;border-radius:8px;background:var(--q-soft);font-size:.88rem;border:1px solid var(--line)}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;align-items:start}
nav.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:grid;gap:2px}
nav.steps button{font:inherit;text-align:left;border:0;background:none;color:var(--ink-2);padding:8px 10px;border-radius:7px;cursor:pointer;display:grid;grid-template-columns:24px 1fr auto;gap:6px;align-items:baseline;font-size:.88rem}
nav.steps button:hover{background:var(--line-2)}
nav.steps button[aria-current="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
nav.steps .n{font-family:var(--f-mono);font-size:.78rem;color:var(--ink-3)}
nav.steps .prog{font-family:var(--f-mono);font-size:.7rem;color:var(--ink-3)}
main{display:grid;gap:16px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:grid;gap:12px;min-width:0}
.stephead{display:grid;gap:6px}
.tablewrap{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:.87rem}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:bottom}
td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
td.r,th.r{text-align:right}
ul{margin:0;padding-left:20px;display:grid;gap:6px;max-width:80ch}
.calc td{font-size:.85rem} .calc td.f{font-family:var(--f-mono);font-size:.78rem;color:var(--ink-2)} .calc td.v{font-family:var(--f-mono);text-align:right;white-space:nowrap;font-weight:500}
.calc tr.total td{border-top:1px solid var(--line);font-weight:650}
.badge{display:inline-block;font-size:.74rem;font-weight:650;padding:2px 9px;border-radius:5px;white-space:nowrap}
.v-keep{background:var(--ok-soft);color:var(--ok)} .v-support{background:var(--accent-soft);color:var(--accent)} .v-fix{background:var(--bad-soft);color:var(--bad)} .v-add{background:var(--add-soft);color:var(--add)}
.decision{border-left:3px solid var(--accent)}
.decision.fix{border-left-color:var(--bad)} .decision.add{border-left-color:var(--add)}
.decision .head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;justify-content:space-between}
.kv{display:grid;gap:3px}
.kv .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
.copybox{font-size:.9rem;background:var(--line-2);border-radius:8px;padding:12px 14px;max-width:84ch;white-space:pre-wrap}
.copyrow{display:flex;gap:10px;align-items:center}
button.btn{font:inherit;font-size:.8rem;padding:5px 11px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
details.cites summary{cursor:pointer;font-size:.8rem;color:var(--ink-2)}
.cite{font-size:.8rem;color:var(--ink-2);padding:6px 0;border-top:1px dashed var(--line);display:grid;gap:2px}
.cite q{font-style:italic;color:var(--ink)}
.cls{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;font-family:var(--f-mono);font-size:.75rem;font-weight:600;background:var(--line-2);color:var(--ink-2)}
.cls.A{background:var(--ok-soft);color:var(--ok)} .cls.D{background:var(--q-soft);color:var(--q)}
.check{display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,260px);gap:14px;padding:12px 0;border-top:1px solid var(--line-2)}
.check:first-of-type{border-top:0}
/* review control */
.rv{display:grid;gap:6px;min-width:0;align-content:start}
.rv .btns{display:flex;flex-wrap:wrap;gap:4px}
.rv button.s{font:inherit;font-size:.76rem;padding:3px 9px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);cursor:pointer}
.rv button.s:hover{border-color:var(--ink-3)}
.rv button.s[aria-pressed="true"][data-s="ok"]{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.rv button.s[aria-pressed="true"][data-s="q"]{background:var(--q-soft);color:var(--q);border-color:var(--q)}
.rv button.s[aria-pressed="true"][data-s="x"]{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.rv button.s:disabled{opacity:.5;cursor:not-allowed}
.rv textarea{font:inherit;font-size:.82rem;width:100%;min-height:52px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.rv .marks{display:flex;flex-wrap:wrap;gap:4px}
.mark{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;padding:2px 8px 2px 3px;border-radius:999px;background:var(--line-2);color:var(--ink-2)}
.mark img{width:16px;height:16px;border-radius:50%}
.mark.ok{background:var(--ok-soft);color:var(--ok)} .mark.q{background:var(--q-soft);color:var(--q)} .mark.x{background:var(--bad-soft);color:var(--bad)}
.note{font-size:.78rem;color:var(--ink-2);padding:4px 8px;border-left:2px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.note b{color:var(--ink);font-weight:600}
.rvlabel{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
td.rvcell{width:230px;min-width:200px}
.savestate{font-size:.72rem;color:var(--ink-3)}
.stack{display:flex;height:24px;border-radius:5px;overflow:hidden;gap:2px;background:var(--line-2)}
.stack span{display:block;height:100%}
.k-electricity{background:var(--elec)} .k-steam{background:var(--steam)} .k-water{background:var(--water)} .k-residual{background:var(--resid)} .k-useful{background:var(--useful)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.closure{font-size:.82rem;font-family:var(--f-mono);color:var(--ok)}
figure{margin:0;display:grid;gap:8px}
figure .imgbox{background:#fff;border-radius:8px;padding:8px;border:1px solid var(--line);overflow-x:auto}
figure img{display:block;width:100%;min-width:640px;height:auto}
figcaption{font-size:.84rem;color:var(--ink-2);max-width:84ch}
.tmprow{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:.84rem}
.tmprow .bar{height:14px;border-radius:3px;margin-top:4px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:.85rem;color:var(--ink-2)}
select{font:inherit;font-size:.85rem;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.edit{display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,250px);gap:14px;padding:14px 0;border-top:1px solid var(--line-2)}
.edit .ba{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:6px}
.edit .ba div{background:var(--line-2);border-radius:7px;padding:8px 10px;font-size:.85rem;min-width:0;overflow-wrap:anywhere}
.edit .ba .lbl{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
.pager{display:flex;justify-content:space-between;gap:10px}
button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:900px){.layout{grid-template-columns:1fr} nav.steps{position:static;display:flex;overflow-x:auto;gap:4px;padding-bottom:4px} nav.steps button{grid-template-columns:auto auto;white-space:nowrap} nav.steps .prog{display:none} .check,.edit{grid-template-columns:1fr}}
@media (max-width:640px){.wrap{padding-inline:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <span class="eyebrow">AL2144 · Group 2 · Holmen Hallsta paper mill, 2023</span>
    <h1>Review of the report draft</h1>
    <div class="statusbar"><span class="pill" id="who">Loading reviewer…</span><span id="progress"></span><span id="savestate" class="savestate"></span></div>
    <div class="banner" id="banner" hidden></div>
  </header>
  <div class="layout">
    <nav class="steps" id="nav" aria-label="Review steps"></nav>
    <main id="main"></main>
  </div>
</div>

<script type="application/json" id="data">/*__DATA__*/</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (v, nd = 0) => typeof v === 'number' ? v.toLocaleString('en-US', {minimumFractionDigits: nd, maximumFractionDigits: nd}) : esc(v);
const auto = v => typeof v !== 'number' ? esc(v) : Math.abs(v) >= 100 ? fmt(v, 0) : Math.abs(v) >= 10 ? fmt(v, 1) : fmt(v, 2);
const STATUS = {ok: 'OK', q: 'Question', x: 'Wrong'};
const S = {db: null, user: null, me: null, canWrite: false, all: {}, mine: {items: {}}, profiles: {}, queue: Promise.resolve(), timer: null, loaded: false};
const stepItems = {};   // step id -> [item ids]
let curStep = null;

function cites(list) {
  if (!list || !list.length) return '';
  return `<details class="cites"><summary>${list.length} source${list.length > 1 ? 's' : ''}</summary>` + list.map(c =>
    `<div class="cite"><span><b>${esc(c.file)}</b> · ${esc(c.loc)} · ${esc(c.year)}</span>${c.value ? `<span class="mono">${esc(c.value)} ${esc(c.unit)}</span>` : ''}${c.quote ? `<q>${esc(c.quote)}</q>` : ''}</div>`).join('') + '</details>';
}
function rv(id, stepId, label) {
  (stepItems[stepId] ??= []).push(id);
  return `<div class="rv" data-item="${esc(id)}">${label ? `<span class="rvlabel">${esc(label)}</span>` : ''}<div class="btns">${Object.entries(STATUS).map(([k, l]) =>
    `<button class="s" data-s="${k}" aria-pressed="false" type="button">${l}</button>`).join('')}</div><textarea id="c-${esc(id)}" aria-label="Note" placeholder="Why? (note)" hidden></textarea><div class="marks"></div><div class="notes"></div></div>`;
}
const verdictCls = v => /^fix/i.test(v) ? 'v-fix' : /^add/i.test(v) ? 'v-add' : /support/i.test(v) ? 'v-support' : 'v-keep';

/* ---------- block renderers ---------- */
const R = {
  p: bl => `<p>${esc(bl.text)}</p>`,
  h: bl => `<h3>${esc(bl.text)}</h3>`,
  list: bl => `<ul>${bl.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`,
  table: bl => `<div class="tablewrap"><table><thead><tr>${bl.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${bl.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`,
  calc: bl => {
    const rows = bl.rows4 ? bl.rows4.map(([a, f, v, u]) => `<tr><td>${esc(a)}</td><td class="f">${esc(f)}</td><td class="v">${auto(v)}</td><td class="faint">${esc(u)}</td></tr>`)
                          : bl.rows.map(([a, f, v]) => `<tr><td>${esc(a)}</td><td class="f">${esc(f)}</td><td class="v">${auto(v)}</td></tr>`);
    return `<div class="tablewrap calc"><table><caption class="eyebrow" style="text-align:left;padding-bottom:6px">${esc(bl.title)}</caption><tbody>${rows.join('')}</tbody></table></div>`;
  },
  checks: (bl, st) => `<div><span class="eyebrow">Checks for this step</span>${bl.items.map(c => `<div class="check"><div><b>${esc(c.text)}</b><p class="muted" style="font-size:.88rem;margin-top:3px">How: ${esc(c.how)}</p></div>${rv(c.id, st)}</div>`).join('')}</div>`,
  decision: (bl, st) => { const d = D.decisions[bl.id]; if (!d) return '';
    const kind = /^fix/i.test(d.verdict) ? 'fix' : /^add/i.test(d.verdict) ? 'add' : '';
    return `<div class="panel decision ${kind}" id="${esc(d.id)}"><div class="head"><h3>${esc(d.title)}</h3><span class="badge ${verdictCls(d.verdict)}">${esc(d.verdict)}</span></div>
      <div class="kv"><span class="k">What the draft says</span><p>${esc(d.draft)}</p></div>
      <div class="kv"><span class="k">What we checked</span><p>${esc(d.check)}</p></div>
      <div class="kv"><span class="k">Reasoning</span><ul>${d.why.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>
      <div class="kv"><span class="k">Text for the report</span><div class="copybox">${esc(d.report)}</div></div>
      ${cites(d.cites)}${rv(d.id, st, 'Your verdict on this decision')}</div>`; },
  layer: (bl, st) => { const L = D.layers[bl.id];
    return `<div class="panel"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px"><h3>${esc(L.title)}</h3><span class="closure">Adds up: difference ${fmt(L.closure, 2)} GWh</span></div>
      <div class="stack" role="img" aria-label="${esc(L.title)}">${L.rows.map(r => `<span class="k-${r.kind}" style="flex:${Math.max(r.value, 0)}" title="${esc(r.label)} ${fmt(r.value, 1)} GWh"></span>`).join('')}</div>
      <div class="tablewrap"><table><tbody>${L.rows.map(r => `<tr><td><span class="sw k-${r.kind}"></span>${esc(r.label)}</td><td class="r num">${fmt(r.value, 1)}</td><td class="r num faint">${fmt(r.value / L.total * 100, 1)} %</td></tr>`).join('')}
      <tr><td><b>${esc(L.total_label)}</b></td><td class="r num"><b>${fmt(L.total, 1)}</b></td><td class="r num faint">100 %</td></tr></tbody></table></div></div>`; },
  headline: () => `<div class="tablewrap"><table><thead><tr><th>Result</th><th class="r">Base</th><th class="r">P5–P95</th><th>Unit</th></tr></thead><tbody>${D.headline.map(h => `<tr><td>${esc(h.metric)}</td><td class="r num">${auto(h.base)}</td><td class="r num faint">${auto(h.p5)}–${auto(h.p95)}</td><td class="faint">${esc(h.unit)}</td></tr>`).join('')}</tbody></table></div>`,
  inputs: (bl, st) => `<div class="filters"><label for="clsf">Data class</label><select id="clsf"><option value="">All</option><option value="A">A · official 2023 report</option><option value="B">B · Holmen answer</option><option value="C">C · older or derived</option><option value="D">D · assumption</option></select></div>
    <div class="tablewrap"><table id="intable"><thead><tr><th>Input</th><th class="r">Value</th><th>Range</th><th>Class</th><th>Why this value and range</th><th>Review</th></tr></thead><tbody>
    ${D.inputs.map(i => `<tr data-cls="${esc(i.cls)}"><td><span class="mono" style="font-size:.76rem">${esc(i.param)}</span><br>${esc(i.desc)}</td><td class="r num">${auto(i.value)} <span class="faint">${esc(i.unit)}</span></td><td class="faint" style="font-size:.8rem;min-width:140px">${esc(i.dist)}</td><td><span class="cls ${esc(i.cls)}">${esc(i.cls)}</span></td><td style="font-size:.84rem;min-width:220px">${esc(i.why)}${cites(i.cites)}</td><td class="rvcell">${rv(i.id, st)}</td></tr>`).join('')}</tbody></table></div>`,
  conflicts: (bl, st) => { const g = {}; D.recon.forEach(r => (g[r.input] ??= []).push(r));
    return `<h3>All flagged source values</h3><p class="muted" style="font-size:.88rem">Every source value that carries a flag in the reconciliation table (reports/tables/eda_reconciliation.csv), grouped by model input.</p>` +
      Object.entries(g).map(([inp, rs]) => `<div class="panel"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px"><b>${esc(inp)}</b><span class="faint" style="font-size:.84rem">Model uses <span class="mono">${esc(rs[0].used)}</span></span></div>
      <div class="tablewrap"><table><tbody>${rs.map(r => `<tr><td class="mono" style="font-size:.8rem;min-width:110px">${esc(r.value)}</td><td style="font-size:.82rem">${esc(r.source)}<br><span class="faint">${esc(r.year)}</span>${cites(r.cites)}</td><td style="font-size:.82rem;min-width:200px">${esc(r.flag)}</td><td class="rvcell">${rv(r.id, st)}</td></tr>`).join('')}</tbody></table></div></div>`).join(''); },
  exergy: () => `<div class="tablewrap"><table><thead><tr><th>Process</th><th class="r">Exergy in</th><th class="r">Useful out</th><th class="r">Waste out</th><th class="r">Destroyed</th><th class="r">ψ</th><th class="r">IP</th></tr></thead><tbody>${D.exergy.map(x => `<tr><td>${esc(x.process)}</td><td class="r num">${fmt(x.xin, 0)}</td><td class="r num">${fmt(x.useful, 0)}</td><td class="r num">${fmt(x.waste, 0)}</td><td class="r num"><b>${fmt(x.destroyed, 0)}</b></td><td class="r num">${fmt(x.psi, 0)} %</td><td class="r num faint">${fmt(x.ip, 0)}</td></tr>`).join('')}</tbody></table></div>`,
  tmpfig: () => { const mx = Math.max(...D.tmp.map(f => f.value)), col = {model: 'var(--elec)', independent: 'var(--water)', claim: 'var(--resid)'};
    return `<div class="panel" role="img" aria-label="TMP electricity per tonne of pulp by source">${D.tmp.map(f => `<div class="tmprow"><div>${esc(f.label)}<div class="bar" style="width:${(f.value / mx * 100).toFixed(1)}%;background:${col[f.kind]}"></div></div><span class="num" style="text-align:right">${fmt(f.value)}</span></div>`).join('')}
      <p class="faint" style="font-size:.78rem"><span class="sw" style="background:var(--elec)"></span>model · <span class="sw" style="background:var(--water)"></span>independent plant-level figure · <span class="sw" style="background:var(--resid)"></span>Holmen's "normal" refining range. kWh per tonne of TMP pulp.</p></div>`; },
  copy: (bl, st) => `<div class="copybox" id="cp-${esc(bl.id)}">${esc(bl.text)}</div><div class="copyrow"><button class="btn" type="button" data-copy="${esc(bl.id)}">Copy text</button><span class="savestate" data-copied="${esc(bl.id)}"></span></div>${rv(bl.id, st, 'Your verdict on this text')}`,
  fig: (bl, st) => `<figure><div class="imgbox"><img src="${D.figs[bl.src]}" alt="${esc(bl.caption)}"></div><figcaption>${esc(bl.caption)}</figcaption></figure>${bl.id ? rv(bl.id, st) : ''}`,
  scenarios: bl => `<div class="tablewrap"><table><thead><tr><th>Case</th><th class="r">TMP el.</th><th class="r">Boiler el.</th><th class="r">TMP share of steam</th><th class="r">Other heat uses</th><th class="r">Exergy destroyed</th><th class="r">Combined measures</th><th>What it shows</th></tr></thead><tbody>${bl.rows.map(r => `<tr><td>${esc(r.name)}</td><td class="r num">${fmt(r.el_TMP, 0)}</td><td class="r num">${fmt(r.el_EB, 0)}</td><td class="r num">${fmt(r.rec, 0)} %</td><td class="r num">${fmt(r.stHW, 0)}</td><td class="r num">${fmt(r.xd, 0)}</td><td class="r num">${fmt(r.m4, 0)}</td><td style="font-size:.82rem;min-width:240px">${esc(r.expl)}</td></tr>`).join('')}</tbody></table></div>`,
  measures: (bl, st) => `<div class="tablewrap"><table><thead><tr><th>Measure</th><th class="r">Full year</th><th class="r">P5–P95</th><th class="r">Seasonal lower bound</th><th class="r">MWh/t</th><th>Review</th></tr></thead><tbody>${bl.rows.map(r => `<tr><td>${esc(r.desc)}</td><td class="r num"><b>${fmt(r.base, 0)}</b></td><td class="r num faint">${fmt(r.p5, 0)}–${fmt(r.p95, 0)}</td><td class="r num">${fmt(r.season, 0)}</td><td class="r num">${fmt(r.mwh_t, 3)}</td><td class="rvcell">${rv(r.id, st)}</td></tr>`).join('')}</tbody></table></div><p class="faint" style="font-size:.8rem">GWh/y of electricity saved. Seasonal lower bound = 75 % of the full-year value (no saving in June–August).</p>`,
  limits: (bl, st) => bl.items.map(l => `<div class="check"><div><b>${esc(l.title)}</b><p class="muted" style="font-size:.9rem;margin-top:3px">${esc(l.text)}</p></div>${rv(l.id, st)}</div>`).join(''),
  edits: (bl, st) => `<div class="filters"><label for="edf">Show</label><select id="edf"><option value="">All edits</option><option value="Fix">Fixes only</option><option value="Add">Additions only</option></select></div>` +
    D.edits.map(e => `<div class="edit" data-type="${esc(e.type)}"><div><div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap"><span class="badge ${e.type === 'Fix' ? 'v-fix' : 'v-add'}">${esc(e.type)}</span><b>${esc(e.section)}</b></div>
      <div class="ba"><div><span class="lbl">Now in the draft</span>${esc(e.current)}</div><div><span class="lbl">Change to</span>${esc(e.new)}</div></div>
      <p class="muted" style="font-size:.84rem;margin-top:6px">Why: ${esc(e.why)}</p></div>${rv(e.id, st)}</div>`).join(''),
};

/* ---------- build steps ---------- */
const main = $('#main');
main.innerHTML = D.steps.map(s => `<section class="stepsec" id="s-${esc(s.id)}" hidden>
  <div class="panel stephead"><span class="eyebrow">Step ${s.n} of ${D.steps.length - 1}</span><h2>${esc(s.title)}</h2></div>
  <div class="panel">${s.blocks.map(bl => (R[bl.t] || (() => ''))(bl, s.id)).join('')}</div>
  <div class="pager">${s.n > 0 ? `<button class="btn" type="button" data-go="${esc(D.steps[s.n - 1].id)}">← ${esc(D.steps[s.n - 1].title)}</button>` : '<span></span>'}${s.n < D.steps.length - 1 ? `<button class="btn" type="button" data-go="${esc(D.steps[s.n + 1].id)}">${esc(D.steps[s.n + 1].title)} →</button>` : ''}</div>
</section>`).join('');
$('#nav').innerHTML = D.steps.map(s => `<button type="button" data-go="${esc(s.id)}"><span class="n">${s.n}</span><span>${esc(s.title)}</span><span class="prog" data-prog="${esc(s.id)}"></span></button>`).join('');

function showStep(id) {
  curStep = id;
  document.querySelectorAll('.stepsec').forEach(s => s.hidden = s.id !== 's-' + id);
  document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-current', b.dataset.go === id));
  try { localStorage.setItem('hallsta-step', id); } catch (e) {}
  if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
}
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]'); if (go) { showStep(go.dataset.go); window.scrollTo({top: 0}); return; }
  const cp = e.target.closest('[data-copy]'); if (cp) { const id = cp.dataset.copy, el = document.getElementById('cp-' + id), st = document.querySelector(`[data-copied="${id}"]`);
    navigator.clipboard.writeText(el.textContent).then(() => st.textContent = 'Copied.').catch(() => { const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); st.textContent = 'Selected. Press Ctrl/Cmd+C.'; }); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'clsf') document.querySelectorAll('#intable tbody tr').forEach(tr => tr.hidden = !!e.target.value && tr.dataset.cls !== e.target.value);
  if (e.target.id === 'edf') document.querySelectorAll('.edit').forEach(el => el.hidden = !!e.target.value && el.dataset.type !== e.target.value);
});
const ids = D.steps.map(s => s.id);
const start = ids.includes(location.hash.slice(1)) ? location.hash.slice(1) : (() => { try { const v = localStorage.getItem('hallsta-step'); return ids.includes(v) ? v : null; } catch (e) { return null; } })();
showStep(start || ids[0]);

/* ---------- marks ---------- */
function renderMarks() {
  const uids = Object.keys(S.all), P = S.profiles;
  const name = u => (P[u] && P[u].name) || 'Someone';
  document.querySelectorAll('.rv').forEach(box => {
    const item = box.dataset.item, my = S.mine.items[item];
    box.querySelectorAll('button.s').forEach(b => { b.setAttribute('aria-pressed', my && my.s === b.dataset.s ? 'true' : 'false'); b.disabled = !S.canWrite; });
    const ta = box.querySelector('textarea'); ta.hidden = !S.canWrite || !my;
    if (document.activeElement !== ta) ta.value = (my && my.c) || '';
    const marks = [], notes = [];
    uids.forEach(u => { if (u === S.me) return; const it = (S.all[u].items || {})[item]; if (!it || !it.s) return;
      marks.push(`<span class="mark ${it.s}"><img alt="" src="${(P[u] && P[u].avatarUrl) || ''}">${esc(name(u))} · ${STATUS[it.s]}</span>`);
      if (it.c) notes.push(`<div class="note"><b>${esc(name(u))}:</b> ${esc(it.c)}</div>`); });
    box.querySelector('.marks').innerHTML = marks.join(''); box.querySelector('.notes').innerHTML = notes.join('');
  });
  let total = 0, done = 0, flagged = 0;
  Object.entries(stepItems).forEach(([sid, items]) => { const d = items.filter(i => S.mine.items[i] && S.mine.items[i].s).length; total += items.length; done += d;
    const el = document.querySelector(`[data-prog="${sid}"]`); if (el) el.textContent = S.me ? `${d}/${items.length}` : items.length; });
  Object.values(stepItems).flat().forEach(i => { if (uids.some(u => { const s = ((S.all[u].items || {})[i] || {}).s; return s === 'q' || s === 'x'; })) flagged++; });
  $('#progress').textContent = S.me ? `You reviewed ${done} of ${total} items · ${uids.length} reviewer${uids.length === 1 ? '' : 's'} · ${flagged} item${flagged === 1 ? '' : 's'} with a question or "wrong"` : `${total} items to review`;
}
async function refreshProfiles() { if (S.user) { const u = Object.keys(S.all); if (S.me && !u.includes(S.me)) u.push(S.me); try { S.profiles = await S.user.profiles(u); } catch (e) {} } renderMarks(); }
function save() {
  if (!S.db || !S.me || !S.canWrite) return;
  const body = JSON.parse(JSON.stringify(S.mine)); body.updated = new Date().toISOString();
  $('#savestate').textContent = 'Saving…';
  S.queue = S.queue.then(() => S.db.doc('reviews/' + S.me).set(body)).then(() => { $('#savestate').textContent = 'Saved'; })
    .catch(e => { if (e && e.code === 'invalid_argument') { S.canWrite = false; banner('You can read this review but not mark items. Ask the owner for Contributor access.'); renderMarks(); }
      else $('#savestate').textContent = 'Not saved: ' + ((e && e.message) || 'try again'); });
}
document.addEventListener('click', e => {
  const b = e.target.closest('.rv button.s'); if (!b || !S.canWrite) return;
  const box = b.closest('.rv'), item = box.dataset.item, s = b.dataset.s, cur = S.mine.items[item] || {};
  if (cur.s === s) delete S.mine.items[item]; else S.mine.items[item] = {...cur, s, t: new Date().toISOString()};
  renderMarks(); save(); if (S.mine.items[item]) box.querySelector('textarea').hidden = false;
});
document.addEventListener('input', e => {
  const ta = e.target.closest('.rv textarea'); if (!ta) return;
  const item = ta.closest('.rv').dataset.item; if (!S.mine.items[item]) return;
  S.mine.items[item].c = ta.value.slice(0, 2000); clearTimeout(S.timer); $('#savestate').textContent = 'Editing…'; S.timer = setTimeout(save, 900);
});
function banner(t) { const b = $('#banner'); b.textContent = t; b.hidden = false; }
renderMarks();
(async () => {
  const cl = window.claude;
  if (!cl || !cl.use) { $('#who').textContent = 'Read-only copy'; banner('Marks cannot be saved in this copy. Open the shared link to review.'); return; }
  const [db, user] = await Promise.all([cl.use('db'), cl.use('user')]);
  S.db = db; S.user = user;
  if (user) { try { S.me = await user.id(); const me = await user.me(); $('#who').innerHTML = `<span class="dot" style="background:${esc(me.color)}"></span>Reviewing as ${esc(me.name || 'you')}`; } catch (e) {} }
  if (!db || !S.me) { $('#who').textContent = 'Read-only'; banner('Sign in to claude.ai to mark items. You can still read everything.'); renderMarks(); return; }
  let can = null; try { can = await user.can('data.write'); } catch (e) {}
  S.canWrite = can !== false; if (can === false) banner('You can read this review but not mark items. Ask the owner for Contributor access.');
  db.collection('reviews').onSnapshot(snap => {
    S.all = {}; snap.docs.forEach(d => { if (d.exists) S.all[d.id] = d.data(); });
    if (S.all[S.me] && !S.loaded) { S.mine = JSON.parse(JSON.stringify(S.all[S.me])); S.mine.items ??= {}; S.loaded = true; }
    refreshProfiles();
  }, err => banner('Live updates stopped (' + err.code + '). Reload to see new marks.'));
  renderMarks();
})();
</script>
